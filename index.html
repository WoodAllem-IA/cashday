<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CashDay">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>CashDay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma coluna, abas fixas embaixo, folhas que sobem de baixo para formulários */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --ink:#13241D; --muted:#5D6F67; --line:#D5DED9;
  --accent:#0E7A55; --accent-ink:#FFFFFF; --accent-soft:#DDEFE6;
  --late:#B83A26; --late-soft:#F8E2DC; --today:#9A6200; --today-soft:#FBEED3; --ok:#0E7A55;
  --shadow:0 1px 2px rgba(19,36,29,.06),0 4px 14px rgba(19,36,29,.06); --on-tone:#FFFFFF;
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#17221D; --ink:#E6EFEA; --muted:#93A69D; --line:#2A3832;
  --accent:#3BBF8A; --accent-ink:#06130D; --accent-soft:#183428;
  --late:#F07A63; --late-soft:#3A1E18; --today:#E8B04C; --today-soft:#352914; --ok:#3BBF8A;
  --shadow:0 1px 2px rgba(0,0,0,.3); --on-tone:#0E1613; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#17221D; --ink:#E6EFEA; --muted:#93A69D; --line:#2A3832;
  --accent:#3BBF8A; --accent-ink:#06130D; --accent-soft:#183428;
  --late:#F07A63; --late-soft:#3A1E18; --today:#E8B04C; --today-soft:#352914; --ok:#3BBF8A;
  --shadow:0 1px 2px rgba(0,0,0,.3); --on-tone:#0E1613; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* topo */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 14px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px}
.brand h1{font-size:24px;font-weight:800}
.date{color:var(--muted);font-size:14px;text-align:right}

/* resumo */
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.sum div{background:var(--surface);border-radius:var(--r);padding:10px 12px;box-shadow:var(--shadow);min-width:0}
.sum small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sum b{display:block;font-family:var(--display);font-size:15px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.sum .l b{color:var(--late)}

.sec{margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:18px;font-weight:800}
.sec span{color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}

/* cartão de cobrança */
.due{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid transparent}
.due.late{border-left-color:var(--late)}
.due.today{border-left-color:var(--today)}
.due .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.due .who{min-width:0}
.due .who b{font-size:17px;display:block}
.due .who span{color:var(--muted);font-size:13px}
.due .amt{text-align:right;flex-shrink:0}
.due .amt b{font-family:var(--display);font-size:20px;font-weight:800;display:block}
.due .amt span{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.chip.late{background:var(--late-soft);color:var(--late)}
.chip.today{background:var(--today-soft);color:var(--today)}
.chip.ok{background:var(--accent-soft);color:var(--ok)}
.chip.soon{background:var(--bg);color:var(--muted)}
.score{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:99px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;color:var(--on-tone);vertical-align:middle}
.score.good{background:var(--ok)}.score.mid{background:var(--today)}.score.bad{background:var(--late)}
.score.big{min-width:40px;height:40px;font-size:19px;font-family:var(--display);flex-shrink:0}
.due .who .score,.hrow .l .score,.score.sm{color:var(--on-tone)}
.score.sm{min-width:24px;height:24px;font-size:13px;margin-left:6px;font-family:var(--body)}
.sbar{display:flex;align-items:center;gap:12px}
.sbar .meter{flex:1;min-width:0}
.sbar .meter div{height:8px;border-radius:99px;background:var(--bg);overflow:hidden}
.sbar .meter i{display:block;height:100%;border-radius:99px}
.sbar .meter small{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.break{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.break b{color:var(--ink);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sec2{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn.danger{background:var(--late-soft);color:var(--late)}
.btn.wa{background:#1FA855;color:#fff}
.btn svg{width:18px;height:18px;flex-shrink:0}
.btn.block{width:100%}

/* clientes */
.search{width:100%;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font:inherit;color:var(--ink);margin-bottom:12px}
.cli{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;flex-shrink:0}
.cli .info{flex:1;min-width:0}
.cli .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cli .info span{font-size:13px;color:var(--muted)}

/* detalhe */
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700;padding:6px 0;min-height:44px}
.hero{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hero h2{font-size:24px;font-weight:800}
.hero .phone{color:var(--muted)}
.loan{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px}
.loan .head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.loan .head b{font-family:var(--display);font-size:18px;font-weight:800}
.bar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:14px}
.grid2 span{color:var(--muted)}
.grid2 b{font-weight:600;text-align:right}
.hist{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .l{min-width:0}
.hrow .l b{display:block;font-size:15px}
.hrow .l span{font-size:13px;color:var(--muted)}
.hrow .r{text-align:right;flex-shrink:0}
.hrow .r b{font-family:var(--display);font-weight:800}
.link{color:var(--late);font-size:13px;font-weight:600;padding:4px 0}

/* abas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:560px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:11px;font-weight:600;color:var(--muted);min-height:54px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent)}
.tab.plus span.p{width:44px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.tab.plus span.p svg{width:20px;height:20px}

/* folhas */
.scrim{position:fixed;inset:0;background:rgba(8,16,12,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-size:21px;font-weight:800;margin-bottom:14px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font:inherit;font-size:16px;color:var(--ink);width:100%}
.f textarea{padding:10px 12px;min-height:90px}
.f .hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
fieldset.radio{border:0;padding:0;margin:0 0 12px;min-width:0}
fieldset.radio legend{font-size:13px;font-weight:600;color:var(--muted);padding:0;margin-bottom:6px}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:8px;font-weight:600;cursor:pointer}
.opt input{width:22px;height:22px;margin:0;accent-color:var(--accent);flex-shrink:0}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.cta{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:6px;box-shadow:var(--shadow)}
.cta.go{border-color:#1FA855;background:var(--accent-soft)}
.cta.done{background:var(--accent-soft);border-color:transparent}
.cta b{display:block;font-family:var(--display);font-size:17px;font-weight:800}
.cta span{font-size:14px;color:var(--muted)}
.qhead{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;font-size:13px;font-weight:600;color:var(--muted)}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.pills button{flex-shrink:0;min-height:38px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.pills button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.kpi small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi b{display:block;font-family:var(--display);font-size:19px;font-weight:800;overflow-wrap:anywhere}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi.good b{color:var(--ok)}.kpi.bad b{color:var(--late)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.rk{width:18px;color:var(--muted);font-weight:700;font-size:13px;text-align:center;flex-shrink:0}
.flabel{font-size:13px;font-weight:600;color:var(--muted)}
.files{display:flex;flex-wrap:wrap;gap:8px}
.fthumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.fthumb a{display:grid;place-items:center;width:100%;height:100%;text-decoration:none}
.fthumb img{width:100%;height:100%;object-fit:cover}
.fdoc{font-weight:800;font-size:13px;color:var(--muted)}
.fdel{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1}
.fadd{display:grid;place-items:center;text-align:center;width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--line);font-size:11px;font-weight:600;color:var(--accent);cursor:pointer}
.calc{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px}
.calc span{color:var(--muted)}
.calc b{text-align:right}
.calc .tot{font-family:var(--display);font-size:18px;font-weight:800;color:var(--ink)}
.calc.warn{background:var(--late-soft)}
.sheet .acts{margin-top:6px}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:12px;padding:12px 14px}
.note ol{margin:6px 0 0;padding-left:20px}
.note li{margin-bottom:4px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--today-soft);color:var(--today);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:14px}
.banner button{font-weight:800;text-decoration:underline;flex-shrink:0;min-height:36px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.card h3{font-size:17px;font-weight:800}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;max-width:calc(100% - 32px)}
</style>
<script>window.CASHDAY_STANDALONE=true</script>
</head>
<body>

<div class="wrap" id="app"></div>
<nav class="tabs" aria-label="Menu"><div class="in" id="tabs"></div></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
const KEY="cashday-v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>(Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=v=>Math.round((Number(v)||0)*100)/100;

/* ---------- datas (sempre AAAA-MM-DD no fuso local) ---------- */
const pad=n=>String(n).padStart(2,"0");
const toISO=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>toISO(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return toISO(d)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5); // a - b
const FREQ={diario:"Diário",semanal:"Semanal",quinzenal:"Quinzenal",mensal:"Mensal"};
function addPeriod(s,f,k){
  k=k??1;
  if(f==="diario")return addDays(s,k);
  if(f==="semanal")return addDays(s,7*k);
  if(f==="quinzenal")return addDays(s,15*k);
  const d=parse(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+k);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return toISO(d);
}
const fmtD=s=>{const d=parse(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear()};
const fmtShort=s=>{const d=parse(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)};

/* ---------- dados ----------
   No endereço do Railway nada fica guardado no aparelho: os dados vêm do banco
   ao abrir e cada mudança vai para o banco na hora. */
const ONLINE=!!window.CASHDAY_SERVIDOR;
let S=load();
function blank(){return{clients:[],loans:[],payments:[],settings:{pct:40,lateType:"fixo",lateValue:50,freq:"mensal",n:1,chargeTime:"09:00"}}}
function load(){
  if(ONLINE){try{localStorage.removeItem(KEY)}catch(e){}return blank()}
  try{const raw=localStorage.getItem(KEY);if(raw){const d=Object.assign(blank(),JSON.parse(raw));d.settings=Object.assign(blank().settings,d.settings);const m=d.settings.msg;if(m&&/^\{nome\}, sua \{parcela\}/.test(m.late||"")&&/^\{nome\}, hoje vence/.test(m.today||""))d.settings.msg=null;return d}}catch(e){}
  return seed();
}
function keep(){if(!ONLINE)try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){keep();queueSync();queuePush()}

/* ---------- nuvem (servidor no Railway) ----------
   O celular continua guardando tudo; a nuvem recebe cada mudança e devolve
   as mudanças feitas em outro aparelho. Em conflito, junta os dois lados. */
const CKEY="cashday-nuvem";
let C=(()=>{try{return JSON.parse(localStorage.getItem(CKEY))||{}}catch(e){return{}}})();
// aberto pelo endereço do Railway: tudo vem das variáveis do servidor, só pede a senha
const SERVER=!!window.CASHDAY_SERVIDOR;
if(SERVER&&C.url!==location.origin)C={url:location.origin};
let cloud={state:"off",err:"",at:null},pushT=null,dirty=false,busy=false,edits=0,ready=!ONLINE;
const cloudOn=()=>!!(C.url&&C.token);
function saveC(){try{localStorage.setItem(CKEY,JSON.stringify(C))}catch(e){}}
async function cloudFetch(path,opt){
  opt=opt||{};
  const r=await fetch(C.url.replace(/\/+$/,"")+path,{method:opt.method||"GET",headers:{"Content-Type":"application/json",...(C.token?{Authorization:"Bearer "+C.token}:{})},body:opt.body?JSON.stringify(opt.body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&C.token){C.token="";saveC();cloud={state:"err",err:"Entre de novo com a senha",at:null};render()}
  if(!r.ok&&r.status!==409)throw new Error(j.erro||("O servidor respondeu "+r.status));
  return Object.assign(j,{status:r.status});
}
function queuePush(){if(!cloudOn())return;dirty=true;edits++;clearTimeout(pushT);pushT=setTimeout(pushCloud,SERVER?200:1500)}
function mergeState(remote,local){
  const out=Object.assign(blank(),remote,{settings:local.settings||remote.settings,robot:local.robot});
  ["clients","loans","payments"].forEach(k=>{
    const m=new Map((remote[k]||[]).map(x=>[x.id,x]));(local[k]||[]).forEach(x=>m.set(x.id,x));out[k]=[...m.values()];
  });
  return out;
}
async function pushCloud(){
  if(!cloudOn()||busy)return;busy=true;const n=edits;
  try{
    let j=await cloudFetch("/api/estado",{method:"PUT",body:{base:C.versao||0,dados:S}});
    if(j.status===409){S=mergeState(j.dados||blank(),S);j=await cloudFetch("/api/estado",{method:"PUT",body:{base:j.versao,dados:S}});
      keep();if(!$("#layer").innerHTML)render()}
    if(j.ok){C.versao=j.versao;saveC();dirty=edits!==n;const was=cloud.state;cloud={state:"ok",err:"",at:new Date()};if(SERVER&&was==="err"&&!$("#layer").innerHTML)render()}
  }catch(e){const was=cloud.state;cloud={state:"err",err:String(e.message||e),at:cloud.at};if(SERVER){setTimeout(pushCloud,5000);if(was!=="err"&&!$("#layer").innerHTML)render()}}
  busy=false;if(dirty&&cloud.state==="ok")pushCloud();else if(view.tab==="ajustes"&&!$("#layer").innerHTML)render();
}
async function pullCloud(){
  if(!cloudOn()||busy)return;
  if(dirty)return pushCloud();
  try{
    const j=await cloudFetch("/api/estado");
    if(!ready){ready=true;C.versao=0;if(!j.dados&&!$("#layer").innerHTML)render()}
    if(j.ok&&j.dados&&j.versao>(C.versao||0)){S=Object.assign(blank(),j.dados,{robot:S.robot});C.versao=j.versao;saveC();
      keep();if(!$("#layer").innerHTML)render()}
    cloud={state:"ok",err:"",at:new Date()};
  }catch(e){cloud={state:"err",err:String(e.message||e),at:cloud.at};if(!ready)render()}
}
const onlySamples=d=>!(d.clients||[]).some(c=>!c.sample);
async function cloudConnect(url,senha,usuario){
  url=url.trim().replace(/\/+$/,"");if(!/^https?:\/\//.test(url))url="https://"+url;
  const dono=C.dono;C={url};const j=await cloudFetch("/api/login",{method:"POST",body:{usuario:usuario||"",senha}});
  if(!j.ok)throw new Error(j.erro||"Não entrou");
  const u=j.usuario||{id:1,admin:true};
  // outro usuário neste aparelho: não mistura os dados de um com os do outro
  if(dono&&dono!==u.id){S=blank();keep();}
  C.token=j.token;C.versao=0;C.user=u;C.dono=u.id;C.login=u.login;saveC();
  if(SERVER){const e=await cloudFetch("/api/estado");S=Object.assign(blank(),e.dados||{});C.versao=e.versao||0;saveC();ready=true;cloud={state:"ok",err:"",at:new Date()};return "baixou"}
  const e=await cloudFetch("/api/estado");
  if(!e.dados){const r=await cloudFetch("/api/estado",{method:"PUT",body:{base:0,dados:S}});C.versao=r.versao;saveC();cloud={state:"ok",err:"",at:new Date()};return "subiu"}
  if(onlySamples(S)){S=Object.assign(blank(),e.dados,{robot:S.robot});C.versao=e.versao;saveC();keep();cloud={state:"ok",err:"",at:new Date()};return "baixou"}
  return {escolher:e};
}

function shrinkImage(file){
  return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);
    img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL("image/jpeg",0.82))};
    img.onerror=()=>{URL.revokeObjectURL(u);no(new Error("Não consegui ler a imagem"))};img.src=u});
}
const readAsDataURL=file=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(file)});
async function uploadFile(kind,id,file){
  const owner=kind==="client"?client(id):S.loans.find(x=>x.id===id);if(!owner)return;
  toast("Enviando "+file.name+"...");
  try{
    const isImg=/^image\//.test(file.type)&&!/gif|svg/.test(file.type);
    if(!isImg&&file.size>8e6)throw new Error("Arquivo maior que 8 MB");
    const url=isImg?await shrinkImage(file):await readAsDataURL(file);
    const mime=isImg?"image/jpeg":file.type||"application/octet-stream",name=isImg?file.name.replace(/\.\w+$/,"")+".jpg":file.name;
    const j=await cloudFetch("/api/arquivos",{method:"POST",body:{nome:name,tipo:mime,base64:url.split(",")[1]}});
    owner.files=(owner.files||[]).concat({id:j.id,name,mime,at:today()});save();render();toast("Arquivo guardado");
  }catch(e){toast("Não enviou: "+(e.message||e))}
}

let syncT=null,robo={state:"off",info:null,err:""};
const roboOn=()=>cloudOn()||!!(S.robot&&S.robot.url&&S.robot.pw);
function queueSync(){if(!roboOn())return;clearTimeout(syncT);syncT=setTimeout(()=>syncRobot(),2500)}
async function roboCall(path,body){
  if(cloudOn()){const j=await cloudFetch("/api/robo"+path,{method:body?"POST":"GET",body});if(!j.ok)throw new Error(j.erro||"Erro no servidor");return j}
  const url=S.robot.url.replace(/\/+$/,"")+path;
  const r=await fetch(url,{method:body?"POST":"GET",headers:{"Content-Type":"application/json","X-Senha":S.robot.pw},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok||!j.ok)throw new Error(j.erro||("O robô respondeu "+r.status));
  return j;
}
async function syncRobot(showToast){
  if(!roboOn())return;
  robo.state="sync";
  try{
    const info=cloudOn()?await roboCall("/status"):await roboCall("/sync",{clients:S.clients,loans:S.loans,settings:S.settings});
    robo={state:"ok",info,err:""};
    if(SERVER&&info.horario)S.settings.chargeTime=info.horario;
    const t=today();let ch=false;
    Object.keys(info.enviadosHoje||{}).forEach(id=>{const l=S.loans.find(x=>x.id===id);if(l&&l.chargedOn!==t){l.chargedOn=t;ch=true}});
    if(ch)keep();
    if(showToast)toast("Robô conectado");
  }catch(e){robo={state:"err",info:null,err:String(e.message||e)};if(showToast)toast("Não conectou: "+robo.err)}
  if(!$("#layer").innerHTML&&(view.tab==="hoje"||view.tab==="ajustes"))render();
}

function seed(){
  const d=blank(),t=today();
  const c=(name,phone,cpf,address)=>{const o={id:uid(),name,phone,cpf,address,notes:"",sample:true,createdAt:t};d.clients.push(o);return o};
  const a=c("Carlos Mendes (exemplo)","11987654321","52998224725","Rua das Flores, 120, Centro"),b=c("Juliana Rocha (exemplo)","21998887766","","Av. Brasil, 45, apto 302"),
        e=c("Roberto Lima (exemplo)","31991234567","",""),f=c("Célia Souza (exemplo)","11955554444","","");
  const L=(cl,principal,pct,n,freq,startDue,paid,lateType,lateValue)=>{
    const o={id:uid(),clientId:cl.id,principal,pct,n,freq,guarantee:"",firstDue:startDue,nextDue:addPeriod(startDue,freq,paid),paid,lateType,lateValue,status:"aberto",sample:true,createdAt:addDays(startDue,-30)};
    d.loans.push(o);return o};
  const l1=L(a,1000,40,1,"mensal",addPeriod(addDays(t,-3),"mensal",-1),0,"fixo",50);
  l1.nextDue=addDays(t,-3); // pagou só juros uma vez, venceu de novo há 3 dias
  d.payments.push({id:uid(),loanId:l1.id,clientId:a.id,date:addPeriod(addDays(t,-3),"mensal",-1),kind:"juros",amount:400,lateDays:0,lateFee:0,inst:1,n:1,due:addPeriod(addDays(t,-3),"mensal",-1),sample:true});
  const l2=L(b,500,40,4,"semanal",addDays(t,-7),1,"fixo",50);
  d.payments.push({id:uid(),loanId:l2.id,clientId:b.id,date:addDays(t,-5),kind:"parcela",amount:275,lateDays:2,lateFee:100,inst:1,n:4,due:addDays(t,-7),sample:true});
  L(e,2000,30,2,"mensal",addDays(t,4),0,"pct",2).guarantee="Moto Honda CG 160 2019, placa ABC1D23 (documento comigo)";
  L(f,300,40,1,"quinzenal",addDays(t,10),0,"fixo",50);
  // empréstimo antigo já quitado, para o painel ter histórico
  const old=L(f,600,40,3,"mensal",addPeriod(t,"mensal",-4),3,"fixo",50);old.status="quitado";old.createdAt=addPeriod(t,"mensal",-5);
  [[-4,0],[-3,2],[-2,0]].forEach(([m,late],i)=>{const due=addPeriod(t,"mensal",m);d.payments.push({id:uid(),loanId:old.id,clientId:f.id,date:addDays(due,late),kind:"parcela",amount:280+late*50,lateDays:late,lateFee:late*50,inst:i+1,n:3,due,sample:true})});
  d.sample=true;
  return d;
}

/* ---------- regras de cálculo ---------- */
const client=id=>S.clients.find(c=>c.id===id);
const total=l=>r2(l.principal*(1+l.pct/100));
const parcel=l=>r2(total(l)/l.n);
const jurosParc=l=>r2(l.principal*l.pct/100/l.n);
const remaining=l=>r2(parcel(l)*(l.n-l.paid));
const daysLate=(l,ref)=>Math.max(0,diffDays(ref||today(),l.nextDue));
function lateFee(l,ref){
  const d=daysLate(l,ref);if(!d)return 0;
  return l.lateType==="pct"?r2(parcel(l)*l.lateValue/100*d):r2(l.lateValue*d);
}
const lateRule=l=>l.lateType==="pct"?(String(l.lateValue).replace(".",",")+"% da parcela por dia"):(brl(l.lateValue)+" por dia");
const openLoans=()=>S.loans.filter(l=>l.status==="aberto");

/* ---------- score do cliente (0 a 10) ----------
   Todo mundo começa com 10. Cada atraso tira pontos conforme o tamanho:
   1 a 7 dias tira 1, 8 a 30 dias tira 2, mais de 30 dias tira 3.
   Conta os pagamentos feitos com atraso e as parcelas que estão atrasadas agora. */
const latePenalty=d=>d<=0?0:d<=7?1:d<=30?2:3;
function scoreInfo(cid){
  const t=today(),ev=[];
  S.payments.forEach(p=>{if(p.clientId===cid&&p.lateDays>0)ev.push(p.lateDays)});
  S.loans.forEach(l=>{if(l.clientId===cid&&l.status==="aberto"&&l.nextDue<t)ev.push(daysLate(l))});
  const score=Math.max(0,10-ev.reduce((s,d)=>s+latePenalty(d),0));
  return{score,count:ev.length,tone:score>=8?"good":score>=5?"mid":"bad"};
}
const SCORE_LABEL={good:"Bom pagador",mid:"Atenção",bad:"Arriscado"};
const scoreBadge=(cid,cls)=>{const x=scoreInfo(cid);return '<span class="score '+x.tone+(cls?" "+cls:"")+'" title="Score '+x.score+' de 10">'+x.score+'</span>'};

/* ---------- navegação ---------- */
let view={tab:"hoje"};
function go(v){view=v;render();window.scrollTo(0,0)}
function renderTabs(){
  const t=view.tab;
  $("#tabs").innerHTML=
    tabBtn("hoje","Hoje",I.today,t==="hoje")+
    tabBtn("clientes","Clientes",I.people,t==="clientes")+
    '<button class="tab plus" data-act="newLoanPick"><span class="p">'+I.plus+'</span>Emprestar</button>'+
    tabBtn("painel","Painel",I.chart,t==="painel")+

}
const tabBtn=(id,label,ico,on)=>'<button class="tab" data-tab="'+id+'"'+(on?' aria-current="page"':'')+'>'+ico+label+'</button>';

function vEntrar(){
  return header().replace(/<div class="banner">[\s\S]*$/,"")+'<div class="card"><h3>Entrar</h3><div class="note" style="background:transparent;padding:0">Digite seu usuário e senha. Só precisa fazer isso uma vez neste aparelho.</div>'+
   '<div class="f" style="margin:0"><label for="n-user">Usuário</label><input id="n-user" autocapitalize="off" autocorrect="off" autocomplete="username" value="'+esc(C.login||"")+'"></div>'+
   '<div class="f" style="margin:0"><label for="n-pw">Senha</label><input id="n-pw" type="password" autocomplete="current-password"></div>'+
   (cloud.state==="err"?'<div class="note" style="color:var(--late)">'+esc(cloud.err)+'</div>':'')+
   '<button class="btn pri" data-act="cloudIn">Entrar</button></div>';
}
function render(){
  const app=$("#app");
  if(SERVER&&!cloudOn()){$("#tabs").innerHTML="";app.innerHTML=vEntrar();return}
  if(!ready){$("#tabs").innerHTML="";app.innerHTML=header()+'<div class="card"><h3>'+(cloud.state==="err"?'Sem conexão com o banco de dados':'Carregando seus dados...')+'</h3>'+
    (cloud.state==="err"?'<div class="note" style="color:var(--late)">'+esc(cloud.err)+'</div><button class="btn pri" data-act="reload">Tentar de novo</button>':'')+'</div>';return}
  renderTabs();
  if(view.tab==="hoje")app.innerHTML=vHoje();
  else if(view.tab==="clientes")app.innerHTML=view.client?vCliente(view.client):vClientes();

function header(){
  const d=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
  return '<div class="top"><div class="brand"><div class="logo">C$</div><h1>CashDay</h1></div><div class="date">'+esc(d.charAt(0).toUpperCase()+d.slice(1))+'</div></div>'+
    (SERVER&&cloud.state==="err"&&ready?'<div class="banner" style="color:var(--late)"><span>Sem conexão com o banco de dados. A última mudança ainda não foi salva; tento de novo sozinho.</span></div>':'')+
    (S.sample?'<div class="banner"><span>Você está vendo clientes de exemplo.</span><button data-act="clearSample">Apagar exemplos</button></div>':'');
}

/* ---------- cobrança do dia ---------- */
const nowHM=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const chargedToday=l=>l.chargedOn===today();
function chargeCTA(list){
  if(!list.length)return "";
  const pend=list.filter(l=>!chargedToday(l)),ct=S.settings.chargeTime||"09:00",late=nowHM()>=ct;
  const auto=roboOn()&&S.settings.autoSend;
  const pendReal=pend.filter(l=>!l.sample&&!(client(l.clientId)||{}).sample);
  if(auto&&pendReal.length)return '<div class="cta"><div><b>Envio automático ligado</b><span>'+(late?"O robô está mandando as cobranças agora, uma a cada 2 minutos. ":"O robô cobra sozinho às "+ct+". ")+pendReal.length+(pendReal.length>1?" clientes na fila.":" cliente na fila.")+'</span></div>'+
   '<button class="btn ghost" data-act="queue">Cobrar agora pelo meu celular</button></div>';
  if(!pend.length)return '<div class="cta done"><div><b>Cobranças de hoje enviadas</b><span>Você cobrou os '+list.length+(list.length>1?" clientes":" cliente")+' de hoje.</span></div></div>';
  return '<div class="cta'+(late?" go":"")+'"><div><b>'+(late?"Hora de cobrar":"Cobrança marcada para "+ct)+'</b><span>'+pend.length+(pend.length>1?" clientes esperando":" cliente esperando")+' a mensagem de hoje.</span></div>'+
   '<button class="btn wa" data-act="queue">'+I.wa+'Cobrar todos ('+pend.length+')</button></div>';
}
let Q=[],qi=0;
function startQueue(){
  const t=today();
  Q=openLoans().filter(l=>l.nextDue<=t&&!chargedToday(l)).sort((a,b)=>a.nextDue.localeCompare(b.nextDue)).map(l=>l.id);qi=0;
  if(!Q.length){toast("Todo mundo já foi cobrado hoje");return}
  showQueue();
}
function showQueue(){
  if(qi>=Q.length){closeSheet();render();toast("Pronto! Todas as cobranças de hoje foram abertas.");return}
  const l=S.loans.find(x=>x.id===Q[qi]);if(!l){qi++;return showQueue()}
  const c=client(l.clientId)||{name:"?"},lf=lateFee(l);
  sheet('<div class="qhead"><span>Cobrança '+(qi+1)+' de '+Q.length+'</span><div class="bar"><i style="width:'+(qi/Q.length*100)+'%"></i></div></div>'+
   '<h3 style="display:flex;align-items:center;gap:8px">'+esc(c.name)+scoreBadge(c.id,"sm")+'</h3>'+
   '<div class="calc num'+(lf?" warn":"")+'"><span>'+(lf?"Total com multa":"Valor da parcela")+'</span><b class="tot">'+brl(parcel(l)+lf)+'</b><span>Situação</span><b>'+statusChip(l)+'</b></div>'+
   '<div class="f"><label for="m-txt">Mensagem (pode editar antes de enviar)</label><textarea id="m-txt" data-l="'+l.id+'" rows="9" style="min-height:200px">'+esc(waText(l))+'</textarea></div>'+
   '<a class="btn wa block" id="m-send" href="'+waLink(l)+'" target="_blank" rel="noopener" data-qsend="'+l.id+'">'+I.wa+'Abrir WhatsApp e enviar</a>'+
   '<div class="acts" style="margin-top:8px"><button class="btn ghost" data-close-btn>Parar</button><button class="btn ghost" data-act="qskip">Pular</button></div>'+
   '<p class="hint" style="font-size:12px;color:var(--muted);margin:10px 0 0">Depois de enviar no WhatsApp, volte para o CashDay que o próximo cliente já vai estar aqui.</p>');
}

/* ---------- tela Hoje ---------- */
function vHoje(){
  const t=today(),open=openLoans();
  const late=open.filter(l=>l.nextDue<t).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
  const now=open.filter(l=>l.nextDue===t);
  const soon=open.filter(l=>l.nextDue>t&&diffDays(l.nextDue,t)<=7).sort((a,b)=>a.nextDue.localeCompare(b.nextDue));
  const sumToday=now.reduce((s,l)=>s+parcel(l),0);
  const sumLate=late.reduce((s,l)=>s+parcel(l)+lateFee(l),0);
  const street=open.reduce((s,l)=>s+remaining(l),0);
  return header()+
   '<div class="sum"><div><small>Vence hoje</small><b class="num">'+brl(sumToday)+'</b></div>'+
   '<div class="l"><small>Atrasado</small><b class="num">'+brl(sumLate)+'</b></div>'+
   '<div><small>Valor investido</small><b class="num">'+brl(street)+'</b></div></div>'+
   chargeCTA(late.concat(now))+
   sec("Atrasados",late.length?late.length+(late.length>1?" clientes":" cliente"):"")+
   (late.length?'<div class="list">'+late.map(dueCard).join("")+'</div>':'<div class="empty">Ninguém atrasado. Boa!</div>')+
   sec("Vencem hoje",now.length?now.length+(now.length>1?" clientes":" cliente"):"")+
   (now.length?'<div class="list">'+now.map(dueCard).join("")+'</div>':'<div class="empty">Nenhum vencimento hoje.</div>')+
   sec("Próximos 7 dias","")+
   (soon.length?'<div class="list">'+soon.map(dueCard).join("")+'</div>':'<div class="empty">Nada nos próximos 7 dias.</div>');
}
const sec=(t,s)=>'<div class="sec"><h2>'+t+'</h2><span>'+esc(s)+'</span></div>';

function statusChip(l){
  const t=today(),d=diffDays(l.nextDue,t);
  if(l.status!=="aberto")return '<span class="chip ok">Quitado</span>';
  if(d<0)return '<span class="chip late">'+(-d)+(d===-1?" dia":" dias")+' de atraso</span>';
  if(d===0)return '<span class="chip today">Vence hoje</span>';
  if(d===1)return '<span class="chip soon">Vence amanhã</span>';
  return '<span class="chip soon">Vence '+fmtShort(l.nextDue)+'</span>';
}
function dueCard(l){
  const c=client(l.clientId)||{name:"?"},t=today(),lf=lateFee(l),cls=l.nextDue<t?"late":l.nextDue===t?"today":"";
  return '<div class="due '+cls+'">'+
    '<div class="row1"><button class="who" style="text-align:left" data-open="'+c.id+'"><b>'+esc(c.name)+scoreBadge(c.id,"sm")+'</b><span>Parcela '+(l.paid+1)+' de '+l.n+' · '+statusChip(l)+(chargedToday(l)?' <span class="chip ok">Cobrado hoje</span>':'')+'</span></button>'+
    '<div class="amt"><b class="num">'+brl(parcel(l)+lf)+'</b><span>'+(lf?"com multa":"a receber")+'</span></div></div>'+
    '<div class="break num"><span>Parcela <b>'+brl(parcel(l))+'</b></span><span>Só porcentagem <b>'+brl(jurosParc(l))+'</b></span>'+(lf?'<span>Multa <b>'+brl(lf)+'</b></span>':'')+'</div>'+
    '<div class="acts"><button class="btn wa" data-charge="'+l.id+'">'+I.wa+'Cobrar</button><button class="btn pri" data-pay="'+l.id+'">'+I.cash+'Recebi</button></div>'+
  '</div>';
}

/* ---------- WhatsApp ---------- */
function waNumber(p){let d=String(p||"").replace(/\D/g,"");if(d.length<=11)d="55"+d;return d}
const MSG_DEFAULT={
  late:"{saudacao}\n\nParcela {parc}: {valor}\nVencimento: {vencimento}\nAtraso: {dias}\nMulta: {multa}\nTotal: {total}",
  today:"{saudacao}\n\nParcela {parc}: {valor}\nVencimento: hoje, {vencimento}",
  before:"{saudacao}\n\nParcela {parc}: {valor}\nVencimento: {vencimento}"
};
const MSG_KEYS=[["{saudacao}","Bom dia, Boa tarde ou Boa noite"],["{parc}","ex.: 2/4"],["{nome}","primeiro nome"],["{parcela}","ex.: parcela 2 de 4"],["{valor}","valor da parcela"],["{vencimento}","data"],["{dias}","dias de atraso"],["{multa}","multa até hoje"],["{total}","parcela + multa"],["{porcentagem}","só a porcentagem (+ multa)"],["{regra}","ex.: R$ 50,00 por dia"]];
const msgTpl=k=>((S.settings.msg||{})[k])||MSG_DEFAULT[k];
function waText(l){
  const c=client(l.clientId)||{name:""},t=today(),dl=daysLate(l),lf=lateFee(l);
  const kind=dl>0?"late":l.nextDue===t?"today":"before";
  const h=new Date().getHours();
  const v={saudacao:h<5?"Boa noite":h<12?"Bom dia":h<18?"Boa tarde":"Boa noite",parc:(l.paid+1)+"/"+l.n,nome:c.name.replace(/\s*\(exemplo\)/,"").split(" ")[0],parcela:"parcela "+(l.paid+1)+" de "+l.n,valor:brl(parcel(l)),vencimento:fmtD(l.nextDue),
    dias:dl+(dl===1?" dia":" dias"),multa:brl(lf),total:brl(parcel(l)+lf),juros:brl(jurosParc(l)+lf),porcentagem:brl(jurosParc(l)+lf),regra:lateRule(l)};
  return msgTpl(kind).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
}
const waHref=(l,text)=>"https://wa.me/"+waNumber((client(l.clientId)||{}).phone)+"?text="+encodeURIComponent(text);
function chargeForm(lid){
  const l=S.loans.find(x=>x.id===lid),c=client(l.clientId)||{name:"?"},txt=waText(l);
  sheet('<h3 style="display:flex;align-items:center;gap:8px">Cobrar '+esc(c.name.replace(/\s*\(exemplo\)/,""))+scoreBadge(c.id,"sm")+'</h3>'+
   '<div class="f"><label for="m-txt">Mensagem (pode editar antes de enviar)</label><textarea id="m-txt" data-l="'+lid+'" rows="10" style="min-height:220px">'+esc(txt)+'</textarea></div>'+
   '<a class="btn wa block" id="m-send" href="'+waHref(l,txt)+'" target="_blank" rel="noopener" data-wa="'+lid+'">'+I.wa+'Enviar no WhatsApp</a>'+
   '<div class="acts" style="margin-top:8px"><button class="btn ghost" data-close-btn>Cancelar</button><button class="btn ghost" data-act="msgReset">Voltar ao texto padrão</button></div>');
}
const waLink=l=>waHref(l,waText(l));

/* ---------- clientes ---------- */
function vClientes(){
  const q=(view.q||"").toLowerCase();
  const list=S.clients.filter(c=>!q||c.name.toLowerCase().includes(q)||String(c.phone).includes(q)||String(c.cpf||"").includes(q.replace(/\D/g,"")||"#")).sort((a,b)=>a.name.localeCompare(b.name,"pt-BR"));
  return header()+
   '<div class="sec" style="margin-top:4px"><h2>Clientes</h2><span>'+S.clients.length+' no total</span></div>'+
   '<input class="search" id="q" type="search" placeholder="Buscar por nome, telefone ou CPF" autocomplete="off">'+
   '<button class="btn sec2 block" data-act="newClient" style="margin-bottom:12px">'+I.plus.replace('stroke-width="2.6"','stroke-width="2.6" width="18" height="18"')+'Novo cliente</button>'+
   '<div class="list" id="clist">'+(list.length?list.map(cliRow).join(""):'<div class="empty">Nenhum cliente'+(q?' com esse nome':'')+'. Toque em Novo cliente para começar.</div>')+'</div>';
}
function cliRow(c){
  const ls=S.loans.filter(l=>l.clientId===c.id&&l.status==="aberto");
  const t=today(),late=ls.some(l=>l.nextDue<t),now=ls.some(l=>l.nextDue===t);
  const owed=ls.reduce((s,l)=>s+remaining(l),0);
  const chip=late?'<span class="chip late">Atrasado</span>':now?'<span class="chip today">Hoje</span>':ls.length?'<span class="chip soon">Em dia</span>':'<span class="chip ok">Sem dívida</span>';
  return '<button class="cli" data-open="'+c.id+'">'+scoreBadge(c.id,"big")+'<div class="info"><b>'+esc(c.name)+'</b><span class="num">'+(ls.length?"Deve "+brl(owed):"Nada em aberto")+'</span></div>'+chip+I.chev+'</button>';
}

function vCliente(id){
  const c=client(id);if(!c){view.client=null;return vClientes()}
  const ls=S.loans.filter(l=>l.clientId===id).sort((a,b)=>(a.status==="aberto"?0:1)-(b.status==="aberto"?0:1)||b.createdAt.localeCompare(a.createdAt));
  const ps=S.payments.filter(p=>p.clientId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const paidTot=ps.reduce((s,p)=>s+p.amount,0),lateCount=ps.filter(p=>p.lateDays>0).length;
  return '<button class="back" data-back>'+I.back+'Clientes</button>'+
   '<div class="hero"><h2>'+esc(c.name)+'</h2>'+scoreBar(id)+'<div class="grid2 num"><span>WhatsApp</span><b>'+esc(fmtPhone(c.phone))+'</b><span>CPF</span><b>'+esc(c.cpf?fmtCPF(c.cpf):"Não informado")+'</b>'+
   '<span>Endereço</span><b style="overflow-wrap:anywhere">'+esc(c.address||"Não informado")+'</b></div>'+(c.notes?'<div class="note">'+esc(c.notes)+'</div>':'')+
   '<div class="flabel">Fotos e documentos</div>'+filesStrip("client",id,c.files)+

   (ls.length?'<div class="list">'+ls.map(loanCard).join("")+'</div>':'<div class="empty">Nenhum empréstimo ainda.</div>')+
   sec("Histórico de pagamentos",ps.length?"Total pago "+brl(paidTot):"")+
   (ps.length?(lateCount?'<div class="note" style="margin-bottom:8px">Pagou com atraso '+lateCount+(lateCount>1?" vezes":" vez")+' de '+ps.length+'.</div>':'')+
     '<div class="hist">'+ps.map(histRow).join("")+'</div>':'<div class="empty">Nenhum pagamento registrado.</div>');
}
function scoreBar(cid){
  const x=scoreInfo(cid),col=x.tone==="good"?"var(--ok)":x.tone==="mid"?"var(--today)":"var(--late)";
  return '<div class="sbar">'+scoreBadge(cid,"big")+'<div class="meter"><div><i style="width:'+(x.score*10)+'%;background:'+col+'"></i></div>'+
   '<small>Score '+x.score+' de 10 · '+SCORE_LABEL[x.tone]+' · '+(x.count?x.count+(x.count>1?" atrasos":" atraso"):"nunca atrasou")+'</small></div></div>';
}
function fmtCPF(v){const d=String(v||"").replace(/\D/g,"");return d.length===11?d.slice(0,3)+"."+d.slice(3,6)+"."+d.slice(6,9)+"-"+d.slice(9):v||""}
function cpfOk(v){const d=String(v).replace(/\D/g,"");if(d.length!==11||/^(\d)\1+$/.test(d))return false;
  for(let k=9;k<11;k++){let s=0;for(let i=0;i<k;i++)s+=Number(d[i])*(k+1-i);if(((s*10)%11)%10!==Number(d[k]))return false}return true}
function fmtPhone(p){const d=String(p||"").replace(/\D/g,"");if(d.length===11)return"("+d.slice(0,2)+") "+d.slice(2,7)+"-"+d.slice(7);if(d.length===10)return"("+d.slice(0,2)+") "+d.slice(2,6)+"-"+d.slice(6);return p||"Sem telefone"}
function loanCard(l){
  const open=l.status==="aberto",lf=open?lateFee(l):0;
  return '<div class="loan"><div class="head"><b class="num">'+brl(l.principal)+'</b>'+statusChip(l)+'</div>'+
   '<div class="bar" aria-label="'+l.paid+' de '+l.n+' parcelas pagas"><i style="width:'+(l.paid/l.n*100)+'%"></i></div>'+
   '<div class="grid2 num"><span>Porcentagem</span><b>'+String(l.pct).replace(".",",")+'% · total '+brl(total(l))+'</b>'+
   '<span>Parcelas</span><b>'+l.paid+' de '+l.n+' pagas · '+FREQ[l.freq].toLowerCase()+'</b>'+

function isLastPayment(p){const ps=S.payments.filter(x=>x.loanId===p.loanId);return ps.length&&ps[ps.length-1].id===p.id}

/* ---------- painel ---------- */
let PF={per:"mes",cli:""};
const PER={hoje:"Hoje","7d":"7 dias",mes:"Este mês",ant:"Mês passado","3m":"3 meses","12m":"12 meses",tudo:"Tudo"};
function perRange(){
  const t=today(),d=parse(t),first=toISO(new Date(d.getFullYear(),d.getMonth(),1));
  if(PF.per==="hoje")return[t,t];
  if(PF.per==="7d")return[addDays(t,-6),t];
  if(PF.per==="mes")return[first,t];
  if(PF.per==="ant")return[toISO(new Date(d.getFullYear(),d.getMonth()-1,1)),addDays(first,-1)];
  if(PF.per==="3m")return[toISO(new Date(d.getFullYear(),d.getMonth()-2,1)),t];
  if(PF.per==="12m")return[toISO(new Date(d.getFullYear(),d.getMonth()-11,1)),t];
  return["0000-01-01",t];
}
// Lucro de um pagamento = valor recebido menos a parte do dinheiro emprestado que voltou
function payProfit(p){
  const l=S.loans.find(x=>x.id===p.loanId);if(!l)return p.amount;
  const cap=l.principal/l.n;
  const back=p.kind==="juros"?0:p.kind==="quitacao"?cap*(l.n-((p.prev&&p.prev.paid)??(p.inst-1))):cap;
  return r2(p.amount-back);
}
const monthKey=s=>s.slice(0,7);
const MES=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function barChart(rows){
  const W=340,H=170,pl=6,pb=22,pt=18,max=Math.max(1,...rows.map(r=>r.rec));
  const bw=(W-pl*2)/rows.length,y=v=>pt+(H-pt-pb)*(1-v/max);
  let g='';
  rows.forEach((r,i)=>{
    const x=pl+i*bw,w=Math.max(4,bw*0.62),cx=x+(bw-w)/2;
    g+='<rect x="'+cx+'" y="'+y(r.rec)+'" width="'+w+'" height="'+(H-pb-y(r.rec))+'" rx="3" fill="var(--accent-soft)"><title>'+r.label+': recebido '+brl(r.rec)+'</title></rect>';
    g+='<rect x="'+cx+'" y="'+y(Math.max(0,r.luc))+'" width="'+w+'" height="'+(H-pb-y(Math.max(0,r.luc)))+'" rx="3" fill="var(--accent)"><title>'+r.label+': rendimento '+brl(r.luc)+'</title></rect>';
    g+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+r.label+'</text>';
  });
  const top=rows.reduce((a,r)=>r.rec>a.rec?r:a,rows[0]);
  if(top&&top.rec>0){const i=rows.indexOf(top);g+='<text x="'+(pl+i*bw+bw/2)+'" y="'+(y(top.rec)-5)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink)">'+brl(top.rec).replace(",00","")+'</text>'}
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Recebido e rendimento por mês"><line x1="'+pl+'" x2="'+(W-pl)+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>'+g+'</svg>';
}
function rankList(rows,empty){
  if(!rows.length)return '<div class="empty">'+empty+'</div>';
  return '<div class="hist">'+rows.map((r,i)=>'<button class="hrow" style="width:100%;text-align:left" data-open="'+r.c.id+'"><div class="l" style="display:flex;align-items:center;gap:10px"><span class="rk">'+(i+1)+'</span>'+scoreBadge(r.c.id)+
    '<div style="min-width:0"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(r.c.name)+'</b><span>'+r.sub+'</span></div></div><div class="r"><b class="num">'+r.val+'</b></div></button>').join("")+'</div>';
}
function vPainel(){
  const [a,b]=perRange(),t=today(),cf=PF.cli;
  const inCli=x=>!cf||x.clientId===cf;
  const pays=S.payments.filter(p=>p.date>=a&&p.date<=b&&inCli(p));
  const rec=pays.reduce((s,p)=>s+p.amount,0),luc=pays.reduce((s,p)=>s+payProfit(p),0),mul=pays.reduce((s,p)=>s+(p.lateFee||0),0);
  const lent=S.loans.filter(l=>inCli(l)&&(l.createdAt||"")>=a&&(l.createdAt||"")<=b).reduce((s,l)=>s+l.principal,0);
  const open=openLoans().filter(inCli),street=open.reduce((s,l)=>s+remaining(l),0);
  const lateNow=open.filter(l=>l.nextDue<t),lateAmt=lateNow.reduce((s,l)=>s+parcel(l)+lateFee(l),0);
  const onTime=pays.length?Math.round(pays.filter(p=>!p.lateDays).length/pays.length*100):null;
  // gráfico: meses do período (no máximo 12; "este mês" e "mês passado" mostram os últimos 6)
  const d=parse(t);let n=PF.per==="3m"?3:PF.per==="12m"||PF.per==="tudo"?12:6;
  const daily=PF.per==="hoje"||PF.per==="7d",rows=[];
  if(daily)for(let i=6;i>=0;i--){const k=addDays(t,-i),ps=S.payments.filter(p=>p.date===k&&inCli(p));
    rows.push({label:fmtShort(k),rec:ps.reduce((s,p)=>s+p.amount,0),luc:ps.reduce((s,p)=>s+payProfit(p),0)})}
  else for(let i=n-1;i>=0;i--){const m=new Date(d.getFullYear(),d.getMonth()-i,1),k=toISO(m).slice(0,7);
    const ps=S.payments.filter(p=>monthKey(p.date)===k&&inCli(p));rows.push({label:MES[m.getMonth()],rec:ps.reduce((s,p)=>s+p.amount,0),luc:ps.reduce((s,p)=>s+payProfit(p),0)})}
  // rankings por cliente
  const by=S.clients.filter(c=>!cf||c.id===cf).map(c=>{
    const ps=pays.filter(p=>p.clientId===c.id),lateP=S.payments.filter(p=>p.clientId===c.id&&p.lateDays>0&&p.date>=a&&p.date<=b);
    const curLate=open.filter(l=>l.clientId===c.id&&l.nextDue<t);
    const lateCount=lateP.length+curLate.length,lateDays=lateP.reduce((s,p)=>s+p.lateDays,0)+curLate.reduce((s,l)=>s+daysLate(l),0);
    const owed=open.filter(l=>l.clientId===c.id).reduce((s,l)=>s+remaining(l),0);
    return{c,luc:ps.reduce((s,p)=>s+payProfit(p),0),rec:ps.reduce((s,p)=>s+p.amount,0),lateCount,lateDays,owed,score:scoreInfo(c.id).score};
  });
  const best=by.filter(x=>x.rec>0).sort((x,y)=>y.luc-x.luc||y.score-x.score).slice(0,5).map(x=>({c:x.c,val:brl(x.luc),sub:"Rendimento · pagou "+brl(x.rec)}));
  const work=by.filter(x=>x.lateCount>0).sort((x,y)=>y.lateCount-x.lateCount||y.lateDays-x.lateDays).slice(0,5).map(x=>({c:x.c,val:x.lateCount+(x.lateCount>1?" atrasos":" atraso"),sub:x.lateDays+(x.lateDays===1?" dia":" dias")+" de atraso no total"}));
  const debt=by.filter(x=>x.owed>0).sort((x,y)=>y.owed-x.owed).slice(0,5).map(x=>({c:x.c,val:brl(x.owed),sub:"Falta receber"}));
  const cs=[...S.clients].sort((x,y)=>x.name.localeCompare(y.name,"pt-BR"));
  return header()+
   '<div class="sec" style="margin-top:4px"><h2>Painel</h2><span>'+(PF.per==="tudo"?"Desde o começo":a===b?fmtD(a):fmtD(a)+" a "+fmtD(b))+'</span></div>'+
   '<div class="pills" role="group" aria-label="Período">'+Object.keys(PER).map(k=>'<button data-per="'+k+'" aria-pressed="'+(PF.per===k)+'">'+PER[k]+'</button>').join("")+'</div>'+
   '<select class="search" id="pf-cli" aria-label="Cliente"><option value="">Todos os clientes</option>'+cs.map(c=>'<option value="'+c.id+'"'+(c.id===cf?" selected":"")+'>'+esc(c.name)+'</option>').join("")+'</select>'+
   '<div class="kpis">'+
    kpi("Recebido",brl(rec),pays.length+(pays.length===1?" pagamento":" pagamentos"))+
    kpi("Rendimento",brl(luc),"porcentagem e multas"+(mul?" · multas "+brl(mul):""),"good")+
    kpi("Valor aplicado",brl(lent),"no período")+
    kpi("Valor investido",brl(street),open.length+(open.length===1?" empréstimo aberto":" empréstimos abertos"))+
    kpi("Atrasado agora",brl(lateAmt),lateNow.length+(lateNow.length===1?" parcela":" parcelas"),lateNow.length?"bad":"")+
    kpi("Pagou em dia",onTime===null?"-":onTime+"%","dos pagamentos do período",onTime!==null&&onTime<70?"bad":"")+
   '</div>'+
   '<div class="card" style="margin-top:14px"><h3>Recebido e rendimento por '+(daily?"dia (últimos 7)":"mês")+'</h3>'+barChart(rows)+
    '<div class="legend"><span><i style="background:var(--accent-soft)"></i>Recebido</span><span><i style="background:var(--accent)"></i>Rendimento</span></div></div>'+
   (cf?'':sec("Melhores clientes","mais rendimento")+rankList(best,"Ninguém pagou nada nesse período.")+
   sec("Clientes com atrasos recorrentes","")+rankList(work,"Ninguém atrasou nesse período. Boa!")+
   sec("Maiores devedores","agora")+rankList(debt,"Ninguém devendo."))+
   '<p class="hint" style="font-size:12px;color:var(--muted);margin-top:14px">Rendimento é o que você recebeu menos o valor aplicado que voltou: porcentagem, multas e pagamentos de só porcentagem contam inteiros.</p>';
}

   '<label class="opt"><input type="radio" name="'+px+'-g" value="sim"'+(has?' checked':'')+'><span>Sim, tem garantia</span></label></fieldset>'+
   '<div class="f" id="'+px+'-gbox"'+(has?'':' hidden')+'><label for="'+px+'-gar">Qual é a garantia?</label><textarea id="'+px+'-gar" placeholder="Ex.: moto Honda CG 2019, placa ABC1D23, documento comigo">'+esc(val)+'</textarea></div>';
}
const garHas=px=>{const r=document.querySelector('input[name="'+px+'-g"]:checked');return !!r&&r.value==="sim"};
const garVal=px=>garHas(px)?$("#"+px+"-gar").value.trim():"";
function garForm(lid){
  const l=S.loans.find(x=>x.id===lid);
  sheet('<h3>Garantia do empréstimo</h3><form id="fg"><input type="hidden" id="g-l" value="'+lid+'">'+garBlock("g",l.guarantee||"")+
   '<div class="acts"><button type="button" class="btn ghost" data-close-btn>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>');
}
function loanVals(){
  return{principal:r2($("#l-val").value),pct:Number($("#l-pct").value)||0,n:Math.max(1,parseInt($("#l-n").value)||1),freq:$("#l-freq").value,
    firstDue:$("#l-due").value,lateType:$("#l-lt").dataset.v,lateValue:Number($("#l-lv").value)||0,
    guarantee:garVal("l")};
}
function loanCalc(){
  const v=loanVals(),el=$("#l-calc");if(!el)return;
  if(!v.principal){el.innerHTML='<span>Digite o valor para ver a conta.</span><b></b>';return}
  const L=Object.assign({paid:0},v);
  el.innerHTML='<span>Porcentagem ('+String(v.pct).replace(".",",")+'%)</span><b>'+brl(v.principal*v.pct/100)+'</b>'+
   '<span>Total a receber</span><b class="tot">'+brl(total(L))+'</b>'+
   '<span>'+v.n+(v.n>1?" parcelas de":" parcela de")+'</span><b>'+brl(parcel(L))+'</b>'+
   '<span>Ou só a porcentagem, por parcela</span><b>'+brl(jurosParc(L))+'</b>'+
   (v.firstDue?'<span>'+(v.n>1?"Última parcela":"Vencimento")+'</span><b>'+fmtD(addPeriod(v.firstDue,v.freq,v.n-1))+'</b>':'');
}

let payKind="parcela";
function payForm(lid){
  const l=S.loans.find(x=>x.id===lid),c=client(l.clientId);payKind="parcela";
  sheet('<h3>Recebi de '+esc(c.name.replace(/\s*\(exemplo\)/,""))+'</h3><form id="fp"><input type="hidden" id="p-l" value="'+lid+'">'+
   '<div class="f"><label>O que ele pagou?</label><div class="seg" id="p-kind"><button type="button" data-v="parcela" aria-pressed="true">Parcela</button><button type="button" data-v="juros" aria-pressed="false">Só porcentagem</button>'+(l.n-l.paid>1?'<button type="button" data-v="quitacao" aria-pressed="false">Quitou</button>':'')+'</div></div>'+
   '<div class="f"><label for="p-date">Data do pagamento</label><input id="p-date" type="date" value="'+today()+'" max="'+today()+'"></div>'+
   '<div class="calc num" id="p-calc"></div>'+
   '<div class="f"><label for="p-amt">Valor recebido (R$)</label><input id="p-amt" type="number" inputmode="decimal" step="0.01" min="0"><span class="hint">Já vem com a conta certa. Mude se ele pagou diferente ou se você deu desconto na multa.</span></div>'+
   '<div class="acts"><button type="button" class="btn ghost" data-close-btn>Cancelar</button><button class="btn pri" type="submit">Confirmar</button></div></form>');
  payCalc(true);
}
function payNumbers(l,kind,date){
  const lf=lateFee(l,date),dl=daysLate(l,date);
  let base=kind==="juros"?jurosParc(l):kind==="quitacao"?remaining(l):parcel(l);
  return{lf,dl,base,tot:r2(base+lf)};
}
function payCalc(setAmt){
  const l=S.loans.find(x=>x.id===$("#p-l").value),date=$("#p-date").value||today();
  const x=payNumbers(l,payKind,date),el=$("#p-calc");
  const after=payKind==="parcela"?(l.paid+1>=l.n?"Empréstimo fica quitado.":"Próxima parcela vence "+fmtD(addPeriod(l.nextDue,l.freq))+"."):
    payKind==="juros"?"A parcela "+(l.paid+1)+" passa para "+fmtD(addPeriod(l.nextDue,l.freq))+". O valor devido continua o mesmo.":"Empréstimo fica quitado.";
  el.className="calc num"+(x.lf?" warn":"");
  el.innerHTML='<span>'+(payKind==="juros"?"Porcentagem da parcela":payKind==="quitacao"?"Saldo restante ("+(l.n-l.paid)+" parcelas)":"Parcela "+(l.paid+1)+" de "+l.n)+'</span><b>'+brl(x.base)+'</b>'+
   (x.lf?'<span>Multa: '+x.dl+(x.dl>1?" dias":" dia")+' × '+(l.lateType==="pct"?String(l.lateValue).replace(".",",")+"%":brl(l.lateValue))+'</span><b>'+brl(x.lf)+'</b>':'<span>Vencimento</span><b>'+fmtD(l.nextDue)+'</b>')+
   '<span>Total</span><b class="tot">'+brl(x.tot)+'</b><span style="grid-column:1/-1;margin-top:4px">'+after+'</span>';
  if(setAmt)$("#p-amt").value=x.tot.toFixed(2);
}

/* ---------- ações ---------- */
function submitClient(){
  const name=$("#c-name").value.trim();if(!name){toast("Coloque o nome");return}
  const phone=$("#c-phone").value.replace(/\D/g,""),notes=$("#c-notes").value.trim(),idEl=$("#c-id");
  const cpf=$("#c-cpf").value.replace(/\D/g,""),address=$("#c-addr").value.trim();
  if(cpf&&!cpfOk(cpf)){toast("CPF inválido. Confira os números.");$("#c-cpf").focus();return}
  if(idEl){const c=client(idEl.value);Object.assign(c,{name,phone,cpf,address,notes});save();closeSheet();render();toast("Cliente atualizado");return}
  const c={id:uid(),name,phone,cpf,address,notes,createdAt:today()};S.clients.push(c);save();
  loanForm(c.id);view={tab:"clientes",client:c.id};render();toast("Cliente salvo. Agora o empréstimo.");
}
function submitLoan(){
  const v=loanVals();if(!v.principal||!v.firstDue){toast("Preencha valor e vencimento");return}
  if(garHas("l")&&!v.guarantee){toast("Escreva qual é a garantia");$("#l-gar").focus();return}
  const l=Object.assign({id:uid(),clientId:$("#l-c").value,paid:0,nextDue:v.firstDue,status:"aberto",createdAt:today()},v);
  S.loans.push(l);save();closeSheet();view={tab:"clientes",client:l.clientId};render();toast("Empréstimo salvo");
}
function submitPay(){
  const l=S.loans.find(x=>x.id===$("#p-l").value),date=$("#p-date").value||today(),x=payNumbers(l,payKind,date);
  const amount=r2($("#p-amt").value);
  const p={id:uid(),loanId:l.id,clientId:l.clientId,date,kind:payKind,amount,lateDays:x.dl,lateFee:x.lf,inst:l.paid+1,n:l.n,due:l.nextDue,
    prev:{paid:l.paid,nextDue:l.nextDue,status:l.status}};
  if(payKind==="parcela"){l.paid++;l.nextDue=addPeriod(l.nextDue,l.freq)}
  else if(payKind==="juros"){l.nextDue=addPeriod(l.nextDue,l.freq)}
  else{l.paid=l.n}
  if(l.paid>=l.n)l.status="quitado";
  S.payments.push(p);save();closeSheet();render();
  toast(l.status==="quitado"?"Pago! Empréstimo quitado.":"Pagamento registrado");
}
function undo(pid){
  const p=S.payments.find(x=>x.id===pid),l=S.loans.find(x=>x.id===p.loanId);
  if(l&&p.prev)Object.assign(l,p.prev);
  S.payments=S.payments.filter(x=>x.id!==pid);save();render();toast("Pagamento desfeito");
}
function confirmSheet(title,text,label,fn){
  sheet('<h3>'+esc(title)+'</h3><p class="note">'+esc(text)+'</p><div class="acts"><button class="btn ghost" data-close-btn>Cancelar</button><button class="btn danger" id="cf-ok">'+esc(label)+'</button></div>');
  $("#cf-ok").onclick=()=>{fn();closeSheet();render()};
}

  if(e.target.id==="pf-cli"){PF.cli=e.target.value;render();return}
  const n=e.target.name;if(n&&/-g$/.test(n)){const px=n.slice(0,-2),box=$("#"+px+"-gbox");box.hidden=e.target.value!=="sim";if(!box.hidden)$("#"+px+"-gar").focus()}if(e.target.id&&e.target.id.startsWith("l-"))loanCalc();if(e.target.id==="p-date")payCalc(true)});
document.addEventListener("submit",e=>{e.preventDefault();const id=e.target.id;if(id==="fc")submitClient();else if(id==="fl")submitLoan();else if(id==="fp")submitPay();else if(id==="fg"){
  const l=S.loans.find(x=>x.id===$("#g-l").value),g=garVal("g");if(garHas("g")&&!g){toast("Escreva qual é a garantia");return}
  l.guarantee=g;save();closeSheet();render();toast("Garantia salva")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(cloudOn())pullCloud();if(roboOn())syncRobot();if(!$("#layer").innerHTML)render()}});

keep();render();syncRobot();if(cloudOn())pullCloud();
if(SERVER&&cloudOn())cloudFetch("/api/eu").then(j=>{if(j.usuario){C.user=j.usuario;C.dono=j.usuario.id;saveC();loadUsers();render()}}).catch(()=>{});
setInterval(()=>{if(cloudOn()&&!document.hidden)pullCloud()},SERVER?8000:60000);
window.addEventListener("beforeunload",e=>{if(SERVER&&dirty){e.preventDefault();e.returnValue=""}});
setInterval(()=>{if(view.tab==="hoje"&&!$("#layer").innerHTML&&!document.hidden)render()},60000);
try{if("serviceWorker" in navigator&&window.CASHDAY_STANDALONE)navigator.serviceWorker.register("sw.js")}catch(e){}
})();
</script>
